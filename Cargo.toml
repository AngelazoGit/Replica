[package]
name = "replica"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Graba lo que haces con ratón y teclado, mira tu pantalla y lo repite por ti: rutas de farmeo, tareas repetitivas y comandos."
license = "MIT"
repository = "https://github.com/AngelazoGit/Replica"
readme = "README.md"
keywords = ["macro", "automation", "bot", "input", "screen"]
categories = ["gui", "accessibility"]

[dependencies]
rdev = { version = "0.5", features = ["serialize"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
xcap = "0.0.14"
mouse_position = "0.1.4"

[profile.release]
strip = true # sin símbolos de depuración: el .exe pasa de ~25 MB a menos de la mitad
lto = "thin"
